; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; PlatformIO only runs the host unit tests. The firmware for the XIAO
; ESP32-C6 builds with idf.py and esp-matter in WSL2: see README.md.

[platformio]
default_envs = native

; Host-side unit tests for the pure-logic modules: `pio test -e native`.
; Needs a host C compiler (gcc or clang) on PATH. Each test compiles its
; module directly, so no ESP-IDF is involved; see test/README.
; The strict warnings are in build_src_flags, which covers the test sources
; but not the Unity library: Unity itself does not build under -Wconversion.
[env:native]
platform = native
test_framework = unity
test_build_src = no
; Fails the run if anything but relays.c can reach the relay pins.
extra_scripts = pre:tools/pio_check_safety.py
build_flags =
    -std=c11
    -Icomponents/buttons/include
    -Icomponents/display/include
    -Icomponents/hvac_logic/include
    -Imatter/components/matter_bridge/include
    -Icomponents/pages/include
    -Icomponents/relays/include
    -Icomponents/sensor/include
    -Icomponents/status_led/include
    -Icomponents/settings/include
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wconversion
    -Wshadow
